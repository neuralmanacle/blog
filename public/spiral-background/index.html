<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neural Manacle · Spiral outlines</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030505;color:#edf6f2;font-family:Arial,sans-serif}#background{position:fixed;inset:0;z-index:0;background:url('./assets/logo.png') center/auto 72% no-repeat}#background.ready{background-image:none}main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:32px;pointer-events:none}header,footer{display:flex;justify-content:space-between;gap:20px;font:11px monospace;letter-spacing:.16em}select,button{pointer-events:auto;border:1px solid #384b40;background:#09110dbb;color:#c7d9cd;padding:12px 16px;font:11px monospace;cursor:pointer}footer{align-items:end;color:#a7b7b0}.caption{max-width:240px;line-height:1.7}#status{letter-spacing:0;color:#b6c9bc}@media(max-width:600px){main{padding:20px}.caption{max-width:180px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body><div id="background" aria-hidden="true"></div><main><header><span>NEURAL MANACLE</span><span>SPIRAL / 001</span></header><footer><div class="caption">A spectrum in motion.<br><span id="status">Loading 3D relief…</span></div><select id="style" aria-label="Display style"><option value="edges">NEON OUTLINES</option><option value="wireframe">RAINBOW WIREFRAME</option><option value="solid">SOLID RAINBOW</option></select><button id="motion" disabled>PAUSE MOTION</button></footer></main>
<script type="module">
const holder=document.querySelector('#background'), status=document.querySelector('#status'),button=document.querySelector('#motion');
try{
 const {createSpiralBackground}=await import('./spiral-background.js');
 const bg=await createSpiralBackground(holder);holder.classList.add('ready');document.querySelector('#style').onchange=e=>bg.setStyle(e.target.value);status.textContent=matchMedia('(prefers-reduced-motion: reduce)').matches?'Reduced motion enabled in device settings.':'Move your pointer to explore.';button.disabled=false;
 let active=true;button.onclick=()=>{active=!active;bg.setMotion(active);button.textContent=active?'PAUSE MOTION':'RESUME MOTION';};
 window.addEventListener('pagehide',()=>bg.dispose(),{once:true});
}catch(e){status.textContent='Static preview · 3D unavailable';button.hidden=true;console.error(e);}
</script></body></html>
