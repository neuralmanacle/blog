<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 195" role="img" aria-label="05-fold-factor"><style>
:root{color-scheme:light dark;--ink:#243247;--muted:#59677a;--grid:#cbd5e1;--teal:#0f766e;--blue:#2563eb;--orange:#b45309;--panel:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--ink:#e2e8f0;--muted:#a5b4c7;--grid:#526174;--teal:#5eead4;--blue:#93c5fd;--orange:#fbbf24;--panel:#334155}}
text{fill:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:12px}
.small{font-size:10px;fill:var(--muted)}.title{font-size:15px;font-weight:650}
.axis{stroke:var(--grid);stroke-width:1}.guide{stroke:var(--grid);stroke-dasharray:4 4}
.a{stroke:var(--teal);fill:none;stroke-width:2.5}.b{stroke:var(--blue);fill:none;stroke-width:2.5}
.fill-a{fill:var(--teal)}.fill-b{fill:var(--blue)}.fill-o{fill:var(--orange)}
</style><text x="25" y="25" class="title" text-anchor="start">Real-valued FFT: one-sided folding factors</text><rect x="45" y="55" width="195" height="115" rx="9" fill="var(--panel)" opacity=".35"/><text x="142" y="80" class="" text-anchor="middle">DC</text><text x="142" y="124" class="title" text-anchor="middle">×1</text><text x="142" y="150" class="small" text-anchor="middle">bin 0</text><rect x="270" y="55" width="195" height="115" rx="9" fill="var(--panel)" opacity=".35"/><text x="367" y="80" class="" text-anchor="middle">Interior bins</text><text x="367" y="124" class="title" text-anchor="middle">×2</text><text x="367" y="150" class="small" text-anchor="middle">bins 1–1023</text><rect x="495" y="55" width="195" height="115" rx="9" fill="var(--panel)" opacity=".35"/><text x="592" y="80" class="" text-anchor="middle">Nyquist</text><text x="592" y="124" class="title" text-anchor="middle">×1</text><text x="592" y="150" class="small" text-anchor="middle">bin 1024</text></svg>