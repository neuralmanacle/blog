<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="08-onset-strength"><style>
:root{color-scheme:light dark;--ink:#243247;--muted:#59677a;--grid:#cbd5e1;--teal:#0f766e;--blue:#2563eb;--orange:#b45309;--panel:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--ink:#e2e8f0;--muted:#a5b4c7;--grid:#526174;--teal:#5eead4;--blue:#93c5fd;--orange:#fbbf24;--panel:#334155}}
text{fill:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:12px}
.small{font-size:10px;fill:var(--muted)}.title{font-size:15px;font-weight:650}
.axis{stroke:var(--grid);stroke-width:1}.guide{stroke:var(--grid);stroke-dasharray:4 4}
.a{stroke:var(--teal);fill:none;stroke-width:2.5}.b{stroke:var(--blue);fill:none;stroke-width:2.5}
.fill-a{fill:var(--teal)}.fill-b{fill:var(--blue)}.fill-o{fill:var(--orange)}
</style><text x="25" y="25" class="title" text-anchor="start">Positive spectral change: only increases contribute</text><line x1="40" y1="175" x2="680" y2="175" class="axis"/><rect x="65" y="145.0" width="30" height="30.0" rx="3" class="fill-b" opacity="0.7"/><rect x="100" y="97.0" width="30" height="78.0" rx="3" class="fill-a" opacity="0.8"/><text x="95" y="194" class="small" text-anchor="middle">Bin 1</text><rect x="190" y="97.0" width="30" height="78.0" rx="3" class="fill-b" opacity="0.7"/><rect x="225" y="139.0" width="30" height="36.0" rx="3" class="fill-a" opacity="0.8"/><text x="220" y="194" class="small" text-anchor="middle">Bin 2</text><rect x="315" y="133.0" width="30" height="42.0" rx="3" class="fill-b" opacity="0.7"/><rect x="350" y="109.0" width="30" height="66.0" rx="3" class="fill-a" opacity="0.8"/><text x="345" y="194" class="small" text-anchor="middle">Bin 3</text><rect x="440" y="121.0" width="30" height="54.0" rx="3" class="fill-b" opacity="0.7"/><rect x="475" y="121.0" width="30" height="54.0" rx="3" class="fill-a" opacity="0.8"/><text x="470" y="194" class="small" text-anchor="middle">Bin 4</text><rect x="565" y="151.0" width="30" height="24.0" rx="3" class="fill-b" opacity="0.7"/><rect x="600" y="79.0" width="30" height="96.0" rx="3" class="fill-a" opacity="0.8"/><text x="595" y="194" class="small" text-anchor="middle">Bin 5</text><text x="55" y="214" class="small" text-anchor="start">Blue: previous frame</text><text x="250" y="214" class="small" text-anchor="start">Teal: current frame</text><text x="465" y="214" class="small" text-anchor="start">Onset uses max(0, teal − blue)</text></svg>