<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" role="img" aria-label="04-power-spectrum"><style>
:root{color-scheme:light dark;--ink:#243247;--muted:#59677a;--grid:#cbd5e1;--teal:#0f766e;--blue:#2563eb;--orange:#b45309;--panel:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--ink:#e2e8f0;--muted:#a5b4c7;--grid:#526174;--teal:#5eead4;--blue:#93c5fd;--orange:#fbbf24;--panel:#334155}}
text{fill:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:12px}
.small{font-size:10px;fill:var(--muted)}.title{font-size:15px;font-weight:650}
.axis{stroke:var(--grid);stroke-width:1}.guide{stroke:var(--grid);stroke-dasharray:4 4}
.a{stroke:var(--teal);fill:none;stroke-width:2.5}.b{stroke:var(--blue);fill:none;stroke-width:2.5}
.fill-a{fill:var(--teal)}.fill-b{fill:var(--blue)}.fill-o{fill:var(--orange)}
</style><text x="25" y="25" class="title" text-anchor="start">One-sided power spectrum: illustrative bins</text><line x1="35" y1="180" x2="685" y2="180" class="axis"/><rect x="45" y="172.25" width="19" height="7.75" rx="3" class="fill-b" opacity="0.85"/><rect x="76" y="166.05" width="19" height="13.950000000000001" rx="3" class="fill-b" opacity="0.85"/><rect x="107" y="158.3" width="19" height="21.7" rx="3" class="fill-b" opacity="0.85"/><rect x="138" y="99.39999999999999" width="19" height="80.60000000000001" rx="3" class="fill-a" opacity="0.85"/><rect x="169" y="149.0" width="19" height="31.0" rx="3" class="fill-b" opacity="0.85"/><rect x="200" y="170.7" width="19" height="9.3" rx="3" class="fill-b" opacity="0.85"/><rect x="231" y="162.95" width="19" height="17.05" rx="3" class="fill-b" opacity="0.85"/><rect x="262" y="66.85" width="19" height="113.15" rx="3" class="fill-a" opacity="0.85"/><rect x="293" y="133.5" width="19" height="46.5" rx="3" class="fill-b" opacity="0.85"/><rect x="324" y="166.05" width="19" height="13.950000000000001" rx="3" class="fill-b" opacity="0.85"/><rect x="355" y="167.6" width="19" height="12.4" rx="3" class="fill-b" opacity="0.85"/><rect x="386" y="114.89999999999999" width="19" height="65.10000000000001" rx="3" class="fill-a" opacity="0.85"/><rect x="417" y="155.2" width="19" height="24.8" rx="3" class="fill-b" opacity="0.85"/><rect x="448" y="167.6" width="19" height="12.4" rx="3" class="fill-b" opacity="0.85"/><rect x="479" y="172.25" width="19" height="7.75" rx="3" class="fill-b" opacity="0.85"/><rect x="510" y="175.35" width="19" height="4.65" rx="3" class="fill-b" opacity="0.85"/><rect x="541" y="173.8" width="19" height="6.2" rx="3" class="fill-b" opacity="0.85"/><rect x="572" y="175.35" width="19" height="4.65" rx="3" class="fill-b" opacity="0.85"/><rect x="603" y="176.9" width="19" height="3.1" rx="3" class="fill-b" opacity="0.85"/><rect x="634" y="176.9" width="19" height="3.1" rx="3" class="fill-b" opacity="0.85"/><text x="3