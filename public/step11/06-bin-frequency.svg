<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-label="06-bin-frequency"><style>
:root{color-scheme:light dark;--ink:#243247;--muted:#59677a;--grid:#cbd5e1;--teal:#0f766e;--blue:#2563eb;--orange:#b45309;--panel:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--ink:#e2e8f0;--muted:#a5b4c7;--grid:#526174;--teal:#5eead4;--blue:#93c5fd;--orange:#fbbf24;--panel:#334155}}
text{fill:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:12px}
.small{font-size:10px;fill:var(--muted)}.title{font-size:15px;font-weight:650}
.axis{stroke:var(--grid);stroke-width:1}.guide{stroke:var(--grid);stroke-dasharray:4 4}
.a{stroke:var(--teal);fill:none;stroke-width:2.5}.b{stroke:var(--blue);fill:none;stroke-width:2.5}
.fill-a{fill:var(--teal)}.fill-b{fill:var(--blue)}.fill-o{fill:var(--orange)}
</style><text x="25" y="25" class="title" text-anchor="start">2048-point FFT at 48 kHz: bin spacing = 23.4375 Hz</text><line x1="45" y1="105" x2="675" y2="105" class="axis"/><line x1="45.0" y1="98" x2="45.0" y2="113" class="axis"/><text x="45.0" y="130" class="small" text-anchor="middle">0</text><line x1="123.75" y1="98" x2="123.75" y2="113" class="axis"/><text x="123.75" y="130" class="small" text-anchor="middle">128</text><line x1="202.5" y1="98" x2="202.5" y2="113" class="axis"/><text x="202.5" y="130" class="small" text-anchor="middle">256</text><line x1="281.25" y1="98" x2="281.25" y2="113" class="axis"/><text x="281.25" y="130" class="small" text-anchor="middle">384</text><line x1="360.0" y1="98" x2="360.0" y2="113" class="axis"/><text x="360.0" y="130" class="small" text-anchor="middle">512</text><line x1="438.75" y1="98" x2="438.75" y2="113" class="axis"/><text x="438.75" y="130" class="small" text-anchor="middle">640</text><line x1="517.5" y1="98" x2="517.5" y2="113" class="axis"/><text x="517.5" y="130" class="small" text-anchor="middle">768</text><line x1="596.25" y1="98" x2="596.25" y2="113" class="axis"/><text x="596.25" y="130" class="small" text-anchor="middle">896</text><line x1="675.0" y1="98" x2="675.0" y2="113" class="axis"/><text x="675.0" y="130" class="small" text-anchor="middle">1024</text><text x="45" y="160" class="small" text-anchor="start">bin 0: 0 Hz</text><text x="360" y="160" class="small" text-anchor="middle">bin 512: 12 kHz</text><text x="675" y="160" class="small" text-anchor="end">bin 1024: 24 kHz</text></svg>